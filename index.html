<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>StudyGPT</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#0d0b14;
  color:#fff;
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

.app{
  min-height:100vh;
  display:flex;
}

.sidebar{
  width:250px;
  background:#15121f;
  border-left:1px solid #29233a;
  padding:20px;
}

.logo{
  font-size:25px;
  font-weight:800;
  margin-bottom:30px;
}

.logo span{color:#8b6cff}

.nav{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.nav button{
  background:#211c2d;
  color:#fff;
  border:0;
  padding:14px;
  border-radius:14px;
  text-align:right;
}

.nav button:hover{
  background:#302743;
}

.main{
  flex:1;
  min-width:0;
}

.top{
  height:70px;
  border-bottom:1px solid #29233a;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
}

.character{
  display:flex;
  gap:10px;
}

.character button{
  border:1px solid #39304e;
  background:#1b1727;
  color:#fff;
  border-radius:20px;
  padding:9px 15px;
}

.character button.active{
  background:#7657ff;
  border-color:#7657ff;
}

.page{
  max-width:1000px;
  margin:auto;
  padding:35px 20px;
}

.hero{
  text-align:center;
  padding:45px 10px;
}

.hero h1{
  font-size:42px;
  margin:10px 0;
}

.hero h1 span{
  color:#8b6cff;
}

.hero p{
  color:#aaa3bd;
}

.chat{
  display:none;
}

.messages{
  min-height:55vh;
  padding:10px;
}

.message{
  max-width:80%;
  margin:12px 0;
  padding:14px 17px;
  border-radius:18px;
  line-height:1.8;
  white-space:pre-wrap;
}

.user{
  background:#6e50e8;
  margin-right:auto;
}

.ai{
  background:#211d2c;
  margin-left:auto;
}

.composer{
  position:sticky;
  bottom:0;
  background:#0d0b14;
  padding:15px 0;
}

.box{
  display:flex;
  gap:10px;
  background:#191521;
  border:1px solid #352c48;
  border-radius:20px;
  padding:10px;
}

textarea{
  flex:1;
  resize:none;
  min-height:55px;
  background:transparent;
  color:#fff;
  border:0;
  outline:0;
  padding:10px;
}

.send{
  width:55px;
  border:0;
  border-radius:15px;
  background:#7657ff;
  color:#fff;
}

.tools{
  display:flex;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap;
}

.tool{
  background:#211c2d;
  color:#fff;
  border:0;
  border-radius:12px;
  padding:9px 13px;
}

.creator{
  display:none;
}

.creator-card{
  background:#171420;
  border:1px solid #30283e;
  border-radius:22px;
  padding:22px;
}

.creator textarea,
.creator input,
.creator select{
  width:100%;
  background:#0e0c14;
  color:#fff;
  border:1px solid #352d45;
  border-radius:13px;
  padding:12px;
  margin:7px 0;
}

.generate{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  background:#7657ff;
  color:#fff;
  font-weight:bold;
  margin-top:10px;
}

.result{
  margin-top:20px;
  min-height:100px;
  border-radius:18px;
  background:#0e0c14;
  padding:20px;
  text-align:center;
}

.result img,
.result video{
  max-width:100%;
  border-radius:15px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  z-index:1000;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-card{
  width:min(500px,100%);
  background:#181521;
  border:1px solid #39304b;
  border-radius:22px;
  padding:25px;
}

.modal-card input{
  width:100%;
  padding:14px;
  background:#0d0b14;
  color:#fff;
  border:1px solid #3b334d;
  border-radius:12px;
  margin:10px 0;
}

.voice-call{
  display:none;
  position:fixed;
  inset:0;
  z-index:2000;
  background:rgba(7,6,12,.96);
  align-items:center;
  justify-content:center;
  padding:20px;
}

.voice-call.show{
  display:flex;
}

.voice-card{
  width:min(520px,95vw);
  text-align:center;
  background:#171420;
  border:1px solid #6548d8;
  border-radius:30px;
  padding:30px;
}

.avatar{
  width:120px;
  height:120px;
  margin:auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:60px;
  background:linear-gradient(135deg,#7051ff,#bd75ff);
  transition:.3s;
}

.avatar.speaking{
  transform:scale(1.1);
  box-shadow:0 0 20px #8b6cff;
}

.voice-name{
  font-size:28px;
  font-weight:bold;
  margin-top:15px;
}

.voice-status{
  color:#aaa3bd;
  margin:10px;
}

.transcript{
  background:#0e0c14;
  border-radius:16px;
  padding:15px;
  min-height:80px;
  margin:20px 0;
  line-height:1.8;
}

.voice-buttons{
  display:flex;
  gap:10px;
  justify-content:center;
}

.voice-buttons button{
  border:0;
  border-radius:15px;
  padding:14px 20px;
  color:#fff;
}

.start{
  background:#7657ff;
}

.stop{
  background:#332c42;
}

.status{
  color:#aaa3bd;
  font-size:13px;
  margin-top:8px;
}

@media(max-width:700px){

  .sidebar{
    display:none;
  }

  .hero h1{
    font-size:32px;
  }

  .message{
    max-width:90%;
  }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="logo">
Study<span>GPT</span> ✦
</div>

<div class="nav">

<button onclick="showHome()">
🏠 الرئيسية
</button>

<button onclick="showChat()">
💬 المحادثة
</button>

<button onclick="showCreator()">
🎨 إنشاء الصور والفيديو
</button>

<button onclick="openVoiceCall()">
📞 مكالمة مباشرة
</button>

<button onclick="openSettings()">
⚙️ إعدادات Gemini
</button>

</div>
</aside>


<main class="main">

<header class="top">

<strong>StudyGPT</strong>

<div class="character">

<button
id="saraBtn"
class="active"
onclick="setCharacter('sara')">
👩🏻 ساره
</button>

<button
id="adyBtn"
onclick="setCharacter('ady')">
👨🏻 عدي
</button>

</div>

</header>


<!-- الرئيسية -->

<section id="home" class="page">

<div class="hero">

<div style="font-size:50px">
✦
</div>

<h1>
مرحبًا بك في <span>StudyGPT</span>
</h1>

<p>
مساعدك الذكي للدراسة والمحادثة وإنشاء الصور.
</p>

<div
class="box"
style="margin-top:30px">

<textarea
id="homePrompt"
placeholder="اسألي ساره أو عدي أي شيء..."></textarea>

<button
class="send"
onclick="sendHomeMessage()">
➤
</button>

</div>

<div class="tools">

<button
class="tool"
onclick="pickChatFile()">
📎 صورة / فيديو / ملف
</button>

<button
class="tool"
onclick="showCreator()">
🎨 إنشاء
</button>

<button
class="tool"
onclick="openVoiceCall()">
📞 تحدثي معي
</button>

</div>

<input
id="fileInput"
type="file"
accept="image/*,video/*,.pdf,.txt,.md,.csv"
style="display:none"
onchange="fileSelected(this)">

<div
id="homeAttachment"
class="status">
</div>

</div>

</section>


<!-- المحادثة -->

<section
id="chat"
class="page chat">

<div
id="messages"
class="messages">
</div>

<div
id="attachmentStatus"
class="status">
</div>

<div class="composer">

<div class="box">

<textarea
id="chatInput"
placeholder="اكتبي رسالتك..."></textarea>

<button
class="send"
onclick="sendChat()">
➤
</button>

</div>

<div class="tools">

<button
class="tool"
onclick="pickChatFile()">
📎 إرفاق صورة / فيديو / ملف
</button>

<button
class="tool"
onclick="openVoiceCall()">
📞 مكالمة
</button>

</div>

<input
id="chatFile"
type="file"
accept="image/*,video/*,.pdf,.txt,.md,.csv"
style="display:none"
onchange="fileSelected(this)">

</div>

</section>


<!-- الإنشاء -->

<section
id="creator"
class="page creator">

<div class="creator-card">

<h2>
🎨 إنشاء بالذكاء الاصطناعي
</h2>

<p style="color:#aaa3bd">
أنشئي صورة أو عدّلي صورة باستخدام Gemini.
</p>

<select id="creatorType">

<option value="image">
🖼️ إنشاء صورة
</option>

</select>

<textarea
id="creativePrompt"
rows="5"
placeholder="مثال: بنت تدرس في مكتبة جامعية مستقبلية...">
</textarea>

<select id="aspect">

<option value="16:9">
أفقي 16:9
</option>

<option value="9:16">
عمودي 9:16
</option>

<option value="1:1">
مربع 1:1
</option>

</select>

<button
class="tool"
onclick="document.getElementById('creativeImage').click()">
📷 أرفقي صورة لتعديلها
</button>

<input
id="creativeImage"
type="file"
accept="image/*"
style="display:none"
onchange="creativeImageSelected(this)">

<button
class="generate"
onclick="generateCreative()">
✨ إنشاء الآن
</button>

<div
id="creativeResult"
class="result">
النتيجة ستظهر هنا
</div>

</div>

</section>

</main>
</div>


<!-- إعدادات Gemini -->

<div
id="settings"
class="modal">

<div class="modal-card">

<h2>
⚙️ إعدادات Gemini
</h2>

<p style="color:#aaa3bd">
ضعي مفتاح Gemini API الخاص بك هنا.
</p>

<input
id="apiKey"
type="password"
placeholder="Gemini API Key">

<button
class="generate"
onclick="saveKey()">
💾 حفظ المفتاح
</button>

<button
class="tool"
style="width:100%;margin-top:10px"
onclick="closeSettings()">
إغلاق
</button>

</div>
</div>


<!-- المكالمة -->

<div
id="voiceCall"
class="voice-call">

<div class="voice-card">

<div
id="voiceAvatar"
class="avatar">
👩🏻
</div>

<div
id="voiceName"
class="voice-name">
ساره
</div>

<div
id="voiceStatus"
class="voice-status">
اضغطي ابدأ وتكلمي
</div>

<div
id="transcript"
class="transcript">
المحادثة الصوتية ستظهر هنا...
</div>

<div class="voice-buttons">

<button
id="startCallBtn"
class="start"
onclick="startVoiceCall()">
🎙️ ابدأ المكالمة
</button>

<button
class="stop"
onclick="stopVoiceCall()">
✕ إنهاء
</button>

</div>

</div>
</div>


<script>

let character="sara";
let pendingFile=null;
let creativeFile=null;

let recognition=null;
let callActive=false;
let speaking=false;

const $=id=>document.getElementById(id);


/* =========================
   نماذج Gemini
========================= */

const CHAT_MODELS=[
  "gemini-3.6-flash",
  "gemini-3.5-flash",
  "gemini-3.1-flash-lite",
  "gemini-2.5-flash"
];

const IMAGE_MODEL="gemini-3.1-flash-image";


/* =========================
   الشخصيات
========================= */

function setCharacter(name){

character=name;

$("saraBtn")
.classList
.toggle(
"active",
name==="sara"
);

$("adyBtn")
.classList
.toggle(
"active",
name==="ady"
);

$("voiceName").textContent=
name==="sara"
?"ساره"
:"عدي";

$("voiceAvatar").textContent=
name==="sara"
?"👩🏻"
:"👨🏻";
}


/* =========================
   التنقل
========================= */

function showHome(){

$("home").style.display="block";
$("chat").style.display="none";
$("creator").style.display="none";

}

function showChat(){

$("home").style.display="none";
$("chat").style.display="block";
$("creator").style.display="none";

}

function showCreator(){

$("home").style.display="none";
$("chat").style.display="none";
$("creator").style.display="block";

}


/* =========================
   إعدادات Gemini
========================= */

function openSettings(){

$("apiKey").value=
localStorage.getItem(
"studygpt_gemini_key"
)||"";

$("settings")
.classList
.add("show");

}

function closeSettings(){

$("settings")
.classList
.remove("show");

}

function saveKey(){

const key=
$("apiKey").value.trim();

if(!key){

alert("ضعي مفتاح Gemini أولًا");

return;

}

localStorage.setItem(
"studygpt_gemini_key",
key
);

alert("تم حفظ مفتاح Gemini ✅");

closeSettings();

}


/* =========================
   اختيار الملفات
========================= */

function pickChatFile(){

const el=$("chatFile");

el.value="";

el.click();

}


function fileSelected(input){

const file=input.files[0];

if(!file)return;

if(file.size>25*1024*1024){

alert(
"حاليًا الحد الأقصى للملف 25MB."
);

return;

}

const reader=
new FileReader();

reader.onload=()=>{

pendingFile={
name:file.name,
type:file.type,
data:reader.result,
size:file.size
};

$("attachmentStatus")
.textContent=
"📎 تم إرفاق: "+
file.name;

$("homeAttachment")
.textContent=
"📎 تم إرفاق: "+
file.name;

};

reader.readAsDataURL(file);

}


function dataParts(dataURL){

const m=
dataURL.match(
/^data:([^;]+);base64,(.*)$/s
);

if(!m)
throw new Error(
"تعذر قراءة الملف"
);

return{
mime:m[1],
data:m[2]
};

}


/* =========================
   إرسال الرسائل
========================= */

function sendHomeMessage(){

const text=
$("homePrompt")
.value
.trim();

if(!text && !pendingFile)
return;

$("homePrompt").value="";

showChat();

sendChatCore(
text ||
"اشرح لي الملف المرفق"
);

}


function sendChat(){

const text=
$("chatInput")
.value
.trim();

if(!text && !pendingFile)
return;

$("chatInput").value="";

sendChatCore(
text ||
"اشرح لي الملف المرفق"
);

}


function sendChatCore(text){

let display=text;

if(pendingFile){

display=
"📎 "+
pendingFile.name+
"\n"+
text;

}

addMessage(
"user",
display
);

const file=pendingFile;

pendingFile=null;

$("attachmentStatus")
.textContent="";

$("homeAttachment")
.textContent="";

askGemini(
text,
file
);

}


function addMessage(
type,
text
){

const div=
document.createElement("div");

div.className=
"message "+
type;

div.textContent=text;

$("messages")
.appendChild(div);

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

}


/* =========================
   معرفة نموذج Gemini المتاح
========================= */

async function getUsableChatModel(key){

try{

const r=
await fetch(
"https://generativelanguage.googleapis.com/v1beta/models?key="+
encodeURIComponent(key)
);

if(r.ok){

const d=
await r.json();

const available=
(d.models||[])
.filter(
m=>
(m.supportedGenerationMethods||[])
.includes(
"generateContent"
)
);

for(
const wanted of CHAT_MODELS
){

if(
available.some(
m=>
m.name===
"models/"+wanted
)
){

return wanted;

}

}

}

}catch(e){}

return "gemini-3.6-flash";

}


/* =========================
   Gemini Chat
========================= */

async function askGemini(
text,
file
){

const key=
localStorage.getItem(
"studygpt_gemini_key"
);

if(!key){

openSettings();

return;

}

const name=
character==="sara"
?"ساره"
:"عدي";

addMessage(
"ai",
"⏳ "+
name+
" يفكر..."
);

const aiMessages=
document.querySelectorAll(
".message.ai"
);

const bubble=
aiMessages[
aiMessages.length-1
];

try{

const model=
await getUsableChatModel(
key
);

const parts=[
{
text:
character==="sara"

?

"أنت ساره، مساعدة دراسة لطيفة وذكية. أجيبي بالعربية وبطريقة سهلة وواضحة."

:

"أنت عدي، مساعد دراسة هادئ وذكي. أجب بالعربية وبطريقة سهلة وواضحة."
}
];

parts.push({
text:text
});


/* ملف */

if(file){

const p=
dataParts(
file.data
);

if(
file.type.startsWith("image/")||
file.type.startsWith("video/")||
file.type==="application/pdf"
){

parts.push({

inlineData:{
mimeType:p.mime,
data:p.data
}

});

}

else{

let raw="";

try{

raw=
decodeURIComponent(
escape(
atob(p.data)
)
);

}catch(e){

try{
raw=atob(p.data);
}catch(x){}

}

parts.push({
text:
"محتوى الملف:\n"+
raw.slice(
0,
150000
)
});

}

}


/* الطلب */

const response=
await fetch(

"https://generativelanguage.googleapis.com/v1beta/models/"+
model+
":generateContent?key="+
encodeURIComponent(key),

{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

contents:[

{
role:"user",
parts:parts
}

]

})

}

);


const data=
await response.json();

if(!response.ok){

throw new Error(
data?.error?.message||
"حدث خطأ في Gemini"
);

}

const answer=
data
?.candidates?.[0]
?.content?.parts
?.map(
x=>x.text||""
)
.join("")
||
"لم يصل رد.";

bubble.textContent=
answer;

}catch(error){

bubble.textContent=
"⚠️ "+
error.message;

}

}


/* =========================
   صورة للتعديل
========================= */

function creativeImageSelected(
input
){

const file=
input.files[0];

if(!file)return;

if(
file.size>
20*1024*1024
){

alert(
"الصورة أكبر من 20MB"
);

return;

}

const reader=
new FileReader();

reader.onload=()=>{

creativeFile={
type:file.type,
data:reader.result,
name:file.name
};

};

reader.readAsDataURL(
file
);

}


/* =========================
   إنشاء الصورة
========================= */

async function generateCreative(){

const key=
localStorage.getItem(
"studygpt_gemini_key"
);

if(!key){

openSettings();

return;

}

const prompt=
$("creativePrompt")
.value
.trim();

if(!prompt){

alert(
"اكتبي وصفًا للصورة"
);

return;

}

const result=
$("creativeResult");

result.innerHTML=
"🖼️ جاري إنشاء الصورة...";

try{

let input=[];


/* الصورة المرفقة */

if(creativeFile){

const p=
dataParts(
creativeFile.data
);

input.push({

type:"image",
data:p.data,
mime_type:p.mime

});

}


/* الوصف */

input.push({

type:"text",
text:prompt

});


const response=
await fetch(

"https://generativelanguage.googleapis.com/v1beta/interactions",

{

method:"POST",

headers:{
"Content-Type":
"application/json",

"x-goog-api-key":
key
},

body:
JSON.stringify({

model:IMAGE_MODEL,

input:input,

response_format:{
type:"image",
aspect_ratio:
$("aspect").value,
image_size:"1K"
}

})

}

);


const data=
await response.json();

if(!response.ok){

throw new Error(
data?.error?.message||
"فشل إنشاء الصورة"
);

}


/* استخراج الصورة */

let img=null;

for(
const step of
(data.steps||[])
){

for(
const block of
(step.content||[])
){

if(
block.type==="image"
){

img=block;

break;

}

}

if(img)break;

}


if(!img){

result.innerHTML=
"⚠️ لم يرجع Gemini صورة. تأكدي أن مفتاحك يملك صلاحية نموذج الصور.";

return;

}


const src=
"data:"+
(
img.mime_type||
"image/png"
)+
";base64,"+
img.data;


result.innerHTML=
'<img src="'+
src+
'" alt="StudyGPT generated image">'+
'<br><br>'+
'<a class="generate" download="studygpt-image.png" href="'+
src+
'">⬇️ حفظ الصورة</a>';


}catch(e){

result.innerHTML=
"⚠️ "+
e.message;

}

}


/* =========================
   المكالمة الصوتية
========================= */

function openVoiceCall(){

if(
!localStorage.getItem(
"studygpt_gemini_key"
)
){

openSettings();

return;

}

$("voiceCall")
.classList
.add("show");

setCharacter(character);

$("voiceStatus")
.textContent=
"اضغطي «ابدأ المكالمة» وتكلمي";

$("transcript")
.textContent=
"أنا أسمعك وأرد عليك صوتيًا 🎙️";

}


function stopVoiceCall(){

callActive=false;

speaking=false;

if(recognition){

try{
recognition.abort();
}catch(e){}

recognition=null;

}

if(
"speechSynthesis"
in window
){

try{
speechSynthesis.cancel();
}catch(e){}

}

$("voiceAvatar")
.classList
.remove("speaking");

$("voiceCall")
.classList
.remove("show");

}


/* =========================
   بدء المكالمة
========================= */

async function startVoiceCall(){

const SR=
window.SpeechRecognition||
window.webkitSpeechRecognition;

if(!SR){

$("voiceStatus")
.textContent=
"المتصفح لا يدعم التعرف على الصوت. استخدمي Chrome على HTTPS.";

return;

}


try{

if(
navigator.mediaDevices
?.getUserMedia
){

await navigator
.mediaDevices
.getUserMedia({
audio:true
});

}

}catch(e){

$("voiceStatus")
.textContent=
"يرجى السماح بصلاحية الميكروفون من إعدادات المتصفح.";

return;

}


if(
"speechSynthesis"
in window
){

speechSynthesis.resume();

}

callActive=true;

listen();

}


/* =========================
   الاستماع
========================= */

function listen(){

if(
!callActive||
speaking
)
return;

const SR=
window.SpeechRecognition||
window.webkitSpeechRecognition;

try{

recognition=
new SR();

}catch(e){

return;

}

recognition.lang=
"ar-SA";

recognition.continuous=
false;

recognition.interimResults=
false;

$("voiceStatus")
.textContent=
"🎙️ أسمعك... تكلمي الآن";


recognition.onresult=
e=>{

const text=
e.results[0][0]
.transcript;

$("transcript")
.textContent=
"أنتِ: "+
text;

voiceAsk(text);

};


recognition.onerror=
e=>{

if(
callActive &&
!speaking
){

$("voiceStatus")
.textContent=
e.error==="not-allowed"

?

"تأكدي من إذن الميكروفون."

:

"لم أسمعك جيدًا، حاولي مرة أخرى.";

}

};


recognition.onend=
()=>{

if(
callActive &&
!speaking
){

setTimeout(
()=>{

if(
callActive &&
!speaking
){

listen();

}

},
500
);

}

};


try{

recognition.start();

}catch(e){}

}


/* =========================
   رد المكالمة
========================= */

async function voiceAsk(text){

const key=
localStorage.getItem(
"studygpt_gemini_key"
);

const name=
character==="sara"
?"ساره"
:"عدي";

$("voiceStatus")
.textContent=
"⏳ "+
name+
" يفكر...";


try{

const model=
await getUsableChatModel(
key
);

const system=
character==="sara"

?

"أنت ساره، مساعدة صوتية أنثى. تحدثي بالعربية السعودية بشكل طبيعي ولطيف، واجعلي ردك قصيرًا كأنه مكالمة."

:

"أنت عدي، مساعد صوتي ذكر. تحدث بالعربية السعودية بشكل طبيعي وهادئ، واجعل ردك قصيرًا كأنه مكالمة.";


const r=
await fetch(

"https://generativelanguage.googleapis.com/v1beta/models/"+
model+
":generateContent?key="+
encodeURIComponent(key),

{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

systemInstruction:{
parts:[
{text:system}
]
},

contents:[
{
role:"user",
parts:[
{text:text}
]
}
]

})

}

);


const d=
await r.json();

if(!r.ok){

throw new Error(
d?.error?.message||
"خطأ في Gemini"
);

}


const answer=
d
?.candidates?.[0]
?.content?.parts
?.map(
x=>x.text||""
)
.join("")
||
"ما قدرت أرد الآن.";


$("transcript")
.textContent=
name+
": "+
answer;

speak(answer);


}catch(e){

$("voiceStatus")
.textContent=
"⚠️ "+
e.message;

}

}


/* =========================
   الصوت
========================= */

function speak(text){

if(
!callActive||
!(
"speechSynthesis"
in window
)
)
return;

try{
speechSynthesis.cancel();
}catch(e){}


const u=
new SpeechSynthesisUtterance(
text.replace(
/[*_#`]/g,
""
)
);

u.lang=
"ar-SA";

u.rate=.95;

u.pitch=
character==="sara"
?1.1
:.85;

speaking=true;

$("voiceAvatar")
.classList
.add("speaking");

$("voiceStatus")
.textContent=
"🔊 "+
(
character==="sara"
?"ساره"
:"عدي"
)+
" يتكلم...";


u.onend=()=>{

speaking=false;

$("voiceAvatar")
.classList
.remove("speaking");

if(callActive){

$("voiceStatus")
.textContent=
"🎙️ دورك...";

setTimeout(
listen,
400
);

}

};


u.onerror=()=>{

speaking=false;

$("voiceAvatar")
.classList
.remove("speaking");

if(callActive)
listen();

};


speechSynthesis.speak(u);

}
